# La puerta de calidad en GitHub Actions (docs/proceso.md): la misma orden que en la máquina, scripts/verificar.sh, sin la
# parte de iOS, que pide macOS (diez veces los minutos de Linux): iOS se verifica en la máquina del dueño. Sube los APK y
# los informes como artefacto durante 14 días. Las acciones van fijadas por commit; el comentario dice la versión.
name: mayeutic

on:
  push:
    branches: [main, 'subfeature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: mayeutic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: La puerta
        env:
          BRUNO_SKIP_IOS: '1'
        run: bash scripts/verificar.sh

      - name: Guardar los APK y los informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puerta
          path: |
            androidApp/build/outputs/apk/
            androidApp/build/outputs/mapping/release/mapping.txt
            androidApp/build/reports/
            **/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
